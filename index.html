<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>혼마루 30년 · 도검난무 로그 시뮬레이션</title>
<style>
:root{--bg:#faf5f7;--panel:#f0e6eb;--fg:#3a2433;--dim:#8a6b7d;--line:#dcc8d2;--warn:#946200;--bad:#c0273d;--good:#1f7a46;--info:#b03a69;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#100e17;--panel:#1a1626;--fg:#efe6ee;--dim:#8b7f99;--line:#2d2640;--warn:#ffd27a;--bad:#ff7b8a;--good:#8fe3a8;--info:#f3a6c2}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#100e17;--panel:#1a1626;--fg:#efe6ee;--dim:#8b7f99;--line:#2d2640;--warn:#ffd27a;--bad:#ff7b8a;--good:#8fe3a8;--info:#f3a6c2}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR","Apple SD Gothic Neo",monospace}
#app{height:100%;max-width:720px;margin:0 auto;padding:10px;box-sizing:border-box}
#game,#intro{height:100%;display:flex;flex-direction:column;gap:8px}
#game{display:none}
#intro{justify-content:center}
h1{margin:0;font-size:18px;text-align:center;color:var(--info)}
#intro p{margin:0;text-align:center;color:var(--dim);font-size:12px}
input{font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;box-sizing:border-box;text-align:center}
#hint{color:var(--bad)!important;min-height:18px}
header{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:12px}
header b{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#st{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.c{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:center}
.c small{display:block;color:var(--dim);font-size:11px}
.c span{font-size:16px;font-weight:700}
.c.low span{color:var(--bad)}
#log{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.l{margin:0 0 2px}.l .d{color:var(--dim)}
.g{color:var(--good)}.w{color:var(--warn)}.b{color:var(--bad)}.i{color:var(--info)}
#mid{flex:1;min-height:0;display:flex;gap:6px}
#mid #log{min-width:0}
#ros{width:112px;flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
#ros h6{margin:0;color:var(--dim);font-size:11px;font-weight:400;text-align:center}
#ros button{padding:5px 4px;font-size:12px;line-height:1.3}
#ros button.kin{border-color:var(--info);color:var(--info)}
.hw{color:var(--warn)!important}
.hb{color:var(--bad)!important}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:20}
#md .box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;margin:16px;max-width:320px;text-align:center}
#md p{margin:0 0 12px}
#md .r{display:flex;gap:8px}
#md .r button{flex:1;padding:10px}
#iq{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:20}
#iq .box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:14px;max-width:360px;width:100%;box-sizing:border-box;max-height:90%;overflow-y:auto}
#iq h4{margin:0 0 6px;color:var(--info);font-size:13px}
#iq p{margin:0 0 10px}
#iq button{display:block;width:100%;margin-bottom:6px;text-align:left;padding:8px 10px}
#iq button small{margin-top:2px}
#iq button:disabled{opacity:.4;cursor:default}
#sm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:30}
#sm .box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:14px;max-width:380px;width:100%;box-sizing:border-box;max-height:88%;overflow-y:auto}
#sm h4{margin:0 0 8px;font-size:15px;color:var(--info)}
#sm p{margin:0 0 8px;font-size:12px}
#sm .k{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;text-align:center;font-size:12px}
#sm .k div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px}
#sm ul{padding:0;margin:0 0 10px}
#sm li{list-style:none;margin:0 0 6px;font-size:12px}
#sm .q{color:var(--dim)}
#sm button{width:100%;padding:10px}
#acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#acts button.on{border-color:var(--info);color:var(--info);font-weight:700}
#pb{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
#pb i{display:block;height:100%;width:0;background:var(--info)}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 4px;cursor:pointer;text-align:center}
button:active{background:var(--line)}
button small{display:block;color:var(--dim);font-size:11px}
#re{display:none;grid-column:3/-1;padding:14px;font-weight:700}
#sr{display:none;grid-column:1/3;padding:14px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2ecdf;--panel:#faf6ec;--fg:#2a2520;--dim:#7d7261;--line:#cfc2a8;--acc:#b3342a;--good:#3e6b47;--warn:#96661a;--bad:#b3342a;--info:#2b4a7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151c;--panel:#211e27;--fg:#e9e2d4;--dim:#948b7c;--line:#3c3745;--acc:#e0624a;--good:#8fbf8a;--warn:#e3b655;--bad:#ef7b6c;--info:#8fb1e0}}
:root[data-theme="dark"]{--bg:#17151c;--panel:#211e27;--fg:#e9e2d4;--dim:#948b7c;--line:#3c3745;--acc:#e0624a;--good:#8fbf8a;--warn:#e3b655;--bad:#ef7b6c;--info:#8fb1e0}
body{font:14px/1.65 'Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;background-color:var(--bg);background-image:radial-gradient(circle at 15% 8%,rgba(160,130,80,.08),transparent 45%),repeating-linear-gradient(0deg,rgba(120,100,70,.035) 0 1px,transparent 1px 3px)}
#game::before,#intro::before{content:'';flex:none;height:10px;background:radial-gradient(circle at 50% 100%,transparent 55%,var(--line) 56%,var(--line) 63%,transparent 64%) 0 0/20px 10px}
h1{font-size:21px;letter-spacing:.1em}
h1 small{display:block;font-size:11px;letter-spacing:.7em;color:var(--acc);margin-bottom:2px}
header{border-bottom:1px solid var(--line);padding-bottom:4px}
#who::before{content:'本';display:inline-block;background:var(--acc);color:#fff;padding:0 4px;margin-right:6px;font-size:11px;border-radius:1px}
.c,#log,button,input{border-radius:2px}
.c{background:var(--panel);box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 3px var(--line);padding:5px 4px}
.c span{font-size:18px}
.c.low span{color:var(--acc)}
#log{background:var(--panel);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line);padding:10px 12px}
.l{padding:3px 0 3px 8px;border-left:2px solid transparent;border-bottom:1px dotted var(--line);opacity:.68;animation:inl .4s ease}
.l.new{opacity:1;border-left-color:var(--acc);font-weight:600}
.l .d{display:inline-block;min-width:4.7em;font-size:11px;font-weight:400}
@keyframes inl{from{opacity:0;transform:translateY(5px)}}
button{background:var(--panel);transition:border-color .15s,background .15s}
button:hover{border-color:var(--acc)}
#acts button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ros h6{color:var(--acc)}
#ros button{border-left:3px solid var(--line)}
#ros button.kin{border-color:var(--acc);color:var(--acc)}
#sw button{border-left:4px solid var(--acc);padding:10px 12px;text-align:left}
#pb{background:var(--line)}
#pb i{background:var(--acc)}
input{font-family:inherit}
#md .box,#iq .box,#sm .box{background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line),0 8px 30px rgba(0,0,0,.35)}
#md,#iq,#sm{background:rgba(40,30,20,.55)}
#iq h4,#sm h4{color:var(--acc);letter-spacing:.06em}
#iq h4::before{content:'【報】 ';color:var(--acc)}
#iq h4.ask::before{content:'【問】 '}
#iq h4.forge::before{content:'【鍛】 '}
#iq h4.story::before{content:'【談】 '}
#sq{display:none;position:fixed;inset:0;background:rgba(40,30,20,.55);align-items:center;justify-content:center;z-index:20}
#sq .box{background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line),0 8px 30px rgba(0,0,0,.35);padding:14px;margin:14px;max-width:360px;width:100%;box-sizing:border-box;max-height:90%;overflow-y:auto}
#sq h4{margin:0 0 6px;color:var(--acc);font-size:14px;letter-spacing:.06em}
#sq h4::before{content:'【出陣】 '}
#sq p{margin:0 0 8px;font-size:12px}
#sq button{display:block;width:100%;margin-bottom:6px;text-align:left;padding:8px 10px}
#sq button.sel{border-color:var(--acc);background:var(--acc);color:#fff}
#sq button.sel small{color:#fff}
#sq #sqg{text-align:center;font-weight:700}
#sq #sqg:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app">
  <div id="intro">
    <h1><small>本丸</small>혼마루 30년</h1>
    <p>시간 역행군으로부터 역사를 지켜야 합니다.</p>
    <input id="nm" maxlength="8" placeholder="사니와의 이름을 입력" autocomplete="off">
    <p id="hint"></p>
    <p>초기도를 한 자루 골라 주십시오.</p>
    <div id="sw" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>
  <div id="game">
    <header><b id="who"></b><span id="day"></span></header>
    <div id="pb"><i id="pf"></i></div>
    <div id="st"></div>
    <div id="mid"><div id="log" aria-live="polite"></div><div id="ros"></div></div>
    <div id="acts"></div>
  </div>
</div>
<div id="sq"><div class="box"><h4>부대 편성</h4><p id="sqt"></p><div id="sql"></div><button id="sqg" onclick="sqGo()">출진합니다</button></div></div>
<div id="sm"><div class="box"><h4 id="sh"></h4><div id="sb"></div><button onclick="$('sm').style.display='none'">닫기</button></div></div>
<div id="iq"><div class="box"><h4 id="ih"></h4><p id="it"></p><div id="ic"></div></div></div>
<div id="md"><div class="box"><p id="mq"></p><div class="r"><button onclick="kinYes()">예</button><button onclick="kinNo()">아니오</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const MAX=30;
const SW=[
 {id:'y',n:'야만바기리 쿠니히로',d:'출진 사고 확률 대폭 감소'},
 {id:'k',n:'카슈 키요미츠',d:'연회 신뢰도 +6 추가'},
 {id:'h',n:'하치스카 코테츠',d:'밭일 수확 +2'},
 {id:'m',n:'무츠노카미 요시유키',d:'출진 옥강 +2'},
 {id:'s',n:'카센 카네사다',d:'휴식 신뢰도 +3, 영력 감소 완화'}];
const POOL=['미카즈키 무네치카','츠루마루 쿠니나가','오오쿠리카라','이치고 히토후리','히젠 타다히로','소우자 사몬지','헤시키리 하세베','야만바기리 쵸우기','이즈미노카미 카네사다'];
let s,over,name='',first,kinQ=null,iss=null;
const C=()=>s.roster.length;
const ga=w=>w+((w.charCodeAt(w.length-1)-44032)%28?'이':'가');
const eul=w=>w+((w.charCodeAt(w.length-1)-44032)%28?'을':'를');
const st=n=>{const h=s.hp[n];return h<=33?2:h<=66?1:0};

const Q=[];let qt=null,after=null;
function log(t,c){
  Q.push([String(s.day).padStart(2,'0')+'년 '+String(s.mon+1).padStart(2,'0')+'월',t,c||'']);
  if(!qt)pump();
}
function whenIdle(f){setTimeout(()=>{if(!qt&&!Q.length)f();else after=f},0)}
function pump(){
  const q=Q.shift();
  if(!q){qt=null;const f=after;after=null;if(f)f();return}
  put(q[0],q[1],q[2]);
  qt=setTimeout(pump,Math.max(70,700/spd));
}
function put(lb,t,c){
  const pv=$('log').querySelector('.new');if(pv)pv.classList.remove('new');
  const d=document.createElement('div');d.className='l new '+c;
  d.innerHTML='<span class="d">'+lb+'</span> '+t;
  const L=$('log');L.appendChild(d);
  while(L.children.length>80)L.firstChild.remove();
  L.scrollTop=1e9;
}
function ros(){
  $('ros').innerHTML='<h6>근시: '+(s.kin||'미지정')+'</h6>'+s.roster.map((n,i)=>'<button class="'+(n===s.kin?'kin':'')+'" onclick="askKin('+i+')">'+(n===s.kin?'★ ':'')+n+(i===0?'<small>초기도</small>':'')+'<small class="'+['','hw','hb'][st(n)]+'">체력 '+s.hp[n]+(st(n)?' '+['','경상','중상'][st(n)]:'')+'</small><small class="'+(s.md[n]<30?'hb':s.md[n]<60?'hw':'')+'">기분 '+s.md[n]+'</small></button>').join('');
}
function askKin(i){
  if(over||kinQ!==null||iss!==null)return;
  const n=s.roster[i];
  if(n===s.kin){log('이미 근시로 있는 도검입니다: '+n,'w');return}
  kinQ=n;$('mq').textContent=n+'을(를) 근시로 설정하시겠습니까?';$('md').style.display='flex';
}
function kinYes(){
  const n=kinQ;kinQ=null;$('md').style.display='none';
  if(!n||!s.roster.includes(n))return;
  if(s.rep<s.day+2)s.rep=s.day+R(2,3);s.kin=n;s.kins.push(n+' ('+s.day+'년)');log(ga(n)+' 근시로 임명되었습니다. 사니와의 명령을 대신 전달합니다.','i');render();
}
function kinNo(){kinQ=null;$('md').style.display='none'}
const EF={food:'군량',en:'영력',mat:'옥강',mo:'신뢰도',lv:'강화',gi:'기분',go:'상대 기분',gain:'합류',hp:'체력',ha:'전원 체력',ma:'전원 기분',eq:'장비'};
const fx=e=>Object.keys(e).map(k=>EF[k]+' '+(e[k]>0?'+':'')+e[k]).join(' · ');
const eff=c=>{const e=Object.assign({},c[1]);if(e.gi===undefined){const m=e.mo||0;e.gi=m>=4?m*4:m<=-4?m*2:0}if(!e.gi)delete e.gi;return e};
const IS=[
[n=>'['+n+'] 연일 출진으로 지쳐 보입니다.',[['출진을 쉬게 합니다',{mo:10,mat:-2},'출진을 쉬게 했습니다.'],['격려하고 계속 보냅니다',{mo:-5,mat:4},'격려 후 출진을 이어갔습니다.'],['연회로 위로합니다',{mo:15,food:-4},'연회를 열어 위로했습니다.']]],
[n=>'['+n+'] 다른 도검과 훈련 방식을 두고 다투었습니다.',[['직접 중재합니다',{en:-3,mo:6},'사니와가 직접 중재에 나섰습니다.'],['합동 훈련으로 가립니다',{mat:-3,mo:4,food:-1},'합동 훈련으로 승부를 냈습니다.'],['스스로 풀게 둡니다',{mo:-6,en:2},'당사자들에게 맡겨 두었습니다.']]],
[n=>'['+n+'] 식사량에 불만이 있다고 합니다.',[['식사량을 줄여 비축합니다',{food:3,mo:-8},'식사량을 줄였습니다.'],['특식을 내줍니다',{food:-4,mo:12},'특식을 마련했습니다.'],['직접 밭을 돌보게 합니다',{en:-2,food:4,mo:-3},'밭일을 맡겼습니다.']]],
[n=>'['+n+'] 열이 나는 듯합니다.',[['정화 의식을 올립니다',{en:-4,mo:6},'정화 의식으로 몸을 돌봤습니다.'],['약재를 구해 옵니다',{mat:-3,mo:5},'약재를 구해 처방했습니다.'],['쉬게 두고 지켜봅니다',{en:2,mo:-5},'경과를 지켜보기로 했습니다.']]],
[n=>'['+n+'] 낡은 병서를 발견했다며 읽어도 되는지 묻습니다.',[['읽게 허락합니다',{mo:5,mat:-2},'병서를 읽도록 허락했습니다.'],['팔아서 옥강으로 바꿉니다',{mat:5,mo:-4},'병서를 팔아 옥강을 얻었습니다.'],['봉인해 결계에 씁니다',{en:4,mo:-2},'병서를 봉인해 결계에 보탰습니다.']]],
[n=>'['+n+'] 야간에 수상한 기척을 느꼈다고 합니다.',[['경비를 늘립니다',{en:-3,mo:5},'야간 경비를 늘렸습니다.'],['결계를 보강합니다',{mat:-3,en:5},'결계를 보강했습니다.'],['기분 탓으로 넘깁니다',{en:2,mo:-5},'대수롭지 않게 넘겼습니다.']]],
[n=>'정부에서 추가 출진을 요청했습니다. 선봉 후보: '+n,[['전면 수락합니다',{mat:6,en:-4,mo:-5},'요청을 전부 수락했습니다.'],['절반만 수락합니다',{mat:3,en:-2,mo:-2},'일부만 수락했습니다.'],['정중히 거절합니다',{mo:5,mat:-2},'정중히 거절했습니다.']]],
[n=>'['+n+'] 꽃놀이를 열자고 제안합니다.',[['소박하게 승인합니다',{mo:10,food:-2},'소박한 꽃놀이를 열었습니다.'],['성대하게 엽니다',{mo:18,food:-6,mat:-2},'성대한 꽃놀이를 열었습니다.'],['보류합니다',{food:2,mo:-4},'꽃놀이를 미뤘습니다.']]],

  if(t==='x'){
    const h1=st(n);
    if(h1>h0)log(n+': '+['','경상','중상'][h1]+' 상태가 되었습니다.','w');
    if(Math.random()<(h0===2?(id==='y'?0.2:0.3):(id==='y'?0.01:0.03)))lose(n);
  }
}
function month(){
  if(sor){sortieTick();return}
  if(s.sch.includes(s.mon)){s.sch=s.sch.filter(x=>x!==s.mon);prog+=MS;openSquad();return}
  if(s.em===s.mon){s.em=-1;if(forgeEvent()){prog+=MS;return}}
  const k=Math.ceil(C()/2);
  for(let i=0;i<k;i++)work();
  s.roster.forEach(x=>{s.hp[x]=Math.min(100,s.hp[x]+1);s.md[x]=Math.min(100,s.md[x]+1)});
  if(C()>1)s.roster.forEach(x=>{
    const m=s.md[x];
    if(x!==s.kin&&m<35&&Math.random()<(m<15?0.3:0.2)){
      const ot=s.roster.filter(y=>y!==x),y=ot[R(0,ot.length-1)];
      s.mo-=3;s.md[x]=Math.max(0,s.md[x]-5);if(y!==s.kin)s.md[y]=Math.max(0,s.md[y]-5);
      log(x+' ↔ '+y+': 기분이 좋지 않아 다툼이 번졌습니다. 불화 (신뢰도 -3 · 두 도검의 기분 -5)','b');
    }
  });
  clamp();
  if(s.mo<=0)return finish('사기 붕괴. 혼마루 결계가 무너졌습니다.');
  if(s.mon<11&&iss===null&&Math.random()<0.14)ask();
  if(s.mon===11){
    yearEnd();
    if(over)return;
    s.mon=0;s.day++;s.sch=sched();s.em=pickEm(s.sch);
  }else s.mon++;
  render();
}
function loop(){
  const t=Date.now(),dt=Math.min(250,t-last)/1000;last=t;
  if(!s||over||paused||kinQ!==null||iss!==null||sq!==null||$('game').style.display!=='flex')return;
  prog+=dt*spd;
  while(prog>=MS&&!over&&iss===null&&sq===null){prog-=MS;month()}
  $('pf').style.width=Math.min(100,(s.mon*MS+prog)/(12*MS)*100)+'%';
}
function summary(){
  const sc=C()*20+s.food+s.en+s.mat+s.lv*5+Math.floor(s.mo/5);
  $('sh').textContent=(s.win?'🌸 ':'🥀 ')+s.msg;
  const k=[['도달',s.day+'년'],['점수',sc],['도검',C()+'자루'],['신뢰도',s.mo],['영력',s.en],['군량',s.food]];
  const t={};s.hist.forEach(h=>{for(const x in h[4])if(x!=='gain')t[x]=(t[x]||0)+h[4][x]});
  for(const x in t)if(!t[x])delete t[x];
  $('sb').innerHTML='<div class="k">'+k.map(x=>'<div>'+x[0]+'<br><b>'+x[1]+'</b></div>').join('')+'</div>'
   +'<p>사니와 ‘'+name.replace(/</g,'&lt;')+'’<br>초기도: '+first.n+'<br>근시: '+(s.kins.join(' → ')||'없음')+'<br>출진: '+(s.srt||0)+'회, 획득 옥강 '+(s.smat||0)+'<br>도검: '+s.roster.map(x=>x+' 체력 '+s.hp[x]+' 기분 '+s.md[x]).join(', ')+(s.lost.length?'<br>파괴: '+s.lost.join(', '):'')+'</p>'
   +'<p>선택 기록 ('+s.hist.length+'회)'+(s.hist.length?'<br><span class="q">선택 누적: '+(fx(t)||'변화 없음')+'</span>':'')+'</p><ul>'
   +(s.hist.map(h=>'<li><span class="q">'+h[0]+'년 '+h[1]+'</span><br>→ <b>'+h[2]+'</b> <span class="q">('+h[3]+')</span></li>').join('')||'<li class="q">보고를 한 번도 받지 않았습니다. (근시 미지정)</li>')+'</ul>';
  $('sm').style.display='flex';
}
function sched(){return [R(0,9)]}
function openSquad(){
  sq=1;sqp=[];sqs=false;
  $('sqt').textContent='수정된 역사를 되돌리기 위해 출진합니다. 출진할 도검을 1~6명 직접 고르십시오. 출진에는 10초가 걸립니다.';
  renderSq();
  whenIdle(()=>{$('sq').style.display='flex'});
}
function renderSq(){
  $('sql').innerHTML=s.roster.map((n,i)=>'<button class="'+(sqp.includes(n)?'sel':'')+'" onclick="togSq('+i+')">'+n+'<small>체력 '+s.hp[n]+(st(n)?' '+['','경상','중상'][st(n)]:'')+' · 기분 '+s.md[n]+'</small></button>').join('');
  $('sql').innerHTML+='<button class="'+(sqs?'sel':'')+'"'+(s.mat<4?' disabled':'')+' onclick="togSup()">보급품을 챙깁니다<small>옥강 -4 · 체력 소모 감소, 귀환 물자 증가 (보유 '+s.mat+')</small></button>';
  $('sqg').disabled=sqp.length<1||sqp.length>6;
  $('sqg').textContent='출진합니다 ('+sqp.length+'/6)';
}
function togSup(){if(s.mat>=4||sqs){sqs=!sqs;renderSq()}}
function togSq(i){const n=s.roster[i],k=sqp.indexOf(n);if(k>=0)sqp.splice(k,1);else if(sqp.length<6)sqp.push(n);renderSq()}
const ERA=['에도 말기','센고쿠 시대','헤이안 시대','가마쿠라 시대','무로마치 시대'];
function sqGo(){
  if(sqp.length<1)return;
  const sup=sqs&&s.mat>=4;if(sup)s.mat-=4;
  sor={squad:sqp.slice(),ph:0,sup,era:ERA[R(0,ERA.length-1)]};
  sq=null;$('sq').style.display='none';render();
}
function sortieTick(){
  const q=sor.squad;
  if(sor.ph===0){
    log('['+q.join(', ')+'] '+sor.era+'로 출진했습니다. 수정된 역사를 되돌리기 위해 시간을 거슬러 갑니다.','i');
    log('시간 역행군과 교전 중입니다.','w');
    sor.ph=1;s.mon++;render();return;
  }
  let mat=0,low=false;
  q.forEach(n=>{const m=s.md[n];if(m<60)low=true;mat+=Math.max(1,Math.round(R(2,4)*(m>=60?1:m>=30?0.7:0.4)))});
  if(first.id==='m'&&q.includes(first.n))mat+=2;
  if(sor.sup)mat=Math.round(mat*1.3);
  const hurt=Math.max(6,20-3*(s.eq||0)-(sor.sup?8:0));
  s.mat+=mat;s.srt++;s.smat+=mat;
  log('귀환했습니다. 옥강 +'+mat+' ('+q.length+'명 출진 · 체력 -'+hurt+(sor.sup?' · 보급품 사용':'')+(low?' · 기분 저조(물자 감소)':'')+')','g');
  q.forEach(n=>{
    const h0=st(n);
    s.hp[n]=Math.max(1,s.hp[n]-hurt);
    if(n!==s.kin)s.md[n]=Math.max(0,s.md[n]-3);
    const h1=st(n);
    if(h1>h0)log(n+': '+['','경상','중상'][h1]+' 상태가 되었습니다.','w');
    if(Math.random()<(h0===2?(first.id==='y'?0.2:0.3):(first.id==='y'?0.01:0.03)))lose(n);
  });
  sor=null;s.mon++;clamp();
  if(s.mo<=0)return finish('신뢰도 붕괴.');
  render();
}
function pickEm(sc){
  const bad=[];sc.forEach(m=>{bad.push(m,m+1)});
  const ok=[];for(let i=0;i<=10;i++)if(!bad.includes(i))ok.push(i);
  return ok[R(0,ok.length-1)];
}
const ALL=SW.map(w=>w.n).concat(POOL);
function addSword(n){
  if(s.roster.includes(n))return;
  s.roster.push(n);s.hp[n]=100;s.md[n]=70;
}
function forgeEvent(){
  const cand=ALL.filter(x=>!s.roster.includes(x));
  if(!cand.length)return false;
  const pk=[],FC=6;
  while(pk.length<3&&cand.length)pk.push(cand.splice(R(0,cand.length-1),1)[0]);
  iss=['[단조] 대장간의 불길 속에서 새로운 도검이 모습을 드러내려 합니다. 옥강 '+FC+'을 들여 한 자루만 단조할 수 있습니다. (보유 옥강 '+s.mat+')',
    pk.map(n=>[eul(n)+' 단조합니다',{mat:-FC,gain:n},ga(n)+' 단조되어 혼마루에 합류했습니다.']).concat([['단조하지 않습니다',{},'이번에는 단조를 보류했습니다. 옥강을 아껴 두었습니다.']])];
  s.cur=[s.day,iss[0]];s.tgt=null;
  $('ih').className='forge';$('ih').textContent='단조 이벤트';
  $('it').textContent=iss[0];
  $('ic').innerHTML=iss[1].map((c,i)=>'<button'+((c[1].mat&&-c[1].mat>s.mat)?' disabled':'')+' onclick="choose('+i+')">'+c[0]+'<small>'+(fx(eff(c))||'변화 없음')+'</small></button>').join('');
  log('대장간에서 새 도검을 단조할 수 있습니다.','i');
  whenIdle(()=>{$('iq').style.display='flex'});
  return true;
}
function setSpd(v){
  if(v===0)paused=!paused;else{spd=v;paused=false}
  document.querySelectorAll('#acts .a').forEach(b=>b.classList.toggle('on',+b.dataset.v===(paused?0:spd)));
  $('acts').children[0].textContent=paused?'▶':'⏸';
  if(s)render();
}
const EV=[
 ()=>{const n=R(2,4);s.mat-=n;s.en-=2;log('시간 역행군 기습! 옥강 -'+n+', 영력 -2','b')},
 ()=>{const n=R(3,6);s.en-=n;log('시공이 일그러졌습니다. 영력 -'+n,'w')},
 ()=>{if(s.mo<30&&C()>1){lose()}else{s.mo-=5;log('혼마루에 감기가 돕니다. 신뢰도 -5','w')}},
 ()=>{const f=R(5,9),m=R(2,4);s.food+=f;s.mat+=m;log('정부 보급품 도착: 군량 +'+f+', 옥강 +'+m,'g')},
 ()=>{s.mo+=8;log('전원이 모여 옛 이야기를 나눴습니다. 신뢰도 +8','i')},
 ()=>{s.mo+=8;log('벚꽃잎이 혼마루에 흩날립니다. 신뢰도 +8','i')},
 ()=>{const n=R(2,4);s.food-=n;log('군량 창고에 습기. 군량 -'+n,'w')}
];
function yearEnd(){
  const fc=C()*2+1,ne=Math.floor(s.en*(first.id==='s'?0.97:0.95)),ec=s.en-ne;
  s.food-=fc;s.en=ne;
  log('연말 정산: 군량 -'+fc+' / 영력 -'+ec+' / 신뢰도 +2','');
  if(s.food<0){s.food=0;s.mo-=10;log('군량 고갈. 굶주림이 이어집니다.','b');lose()}
  if(Math.random()<0.55)EV[R(0,EV.length-1)]();
  s.mo+=2;
  s.roster.forEach(x=>{if(x!==s.kin)s.md[x]=Math.max(0,s.md[x]-4)});
  clamp();
  if(s.en<=0)return finish('사니와의 영력이 바닥났습니다. 혼마루의 결계가 무너졌습니다.');
  if(s.mo<=0)return finish('사기 붕괴. 혼마루 결계가 무너졌습니다.');
  if(s.day>=MAX)return finish('30년 완수! 역사는 지켜졌습니다.',true);
  if(s.kin&&s.day>=s.rep){s.rep=s.day+R(1,2);report()}
}
function finish(msg,win){
  if(!win&&s.mo<=0)msg='신뢰도 붕괴. 도검남사들이 사니와를 떠났습니다. 혼마루는 텅 비었습니다.';
  over=true;s.win=!!win;s.msg=msg;render();
  const sc=C()*20+s.food+s.en+s.mat+s.lv*5+Math.floor(s.mo/5);
  log(msg,win?'g':'b');
  log('도검 '+C()+'자루 / 최종 점수: '+sc+(win?'':' (실패)'),'i');
  document.querySelectorAll('#acts .a').forEach(b=>b.style.display='none');
  $('sr').style.display=$('re').style.display='block';whenIdle(summary);
}
function intro(){
  $('game').style.display='none';$('intro').style.display='flex';$('sm').style.display='none';$('sq').style.display='none';
  $('hint').textContent='';$('nm').value=name;
}
function pick(i){
  const v=$('nm').value.trim();
  if(!v){$('hint').textContent='먼저 사니와의 이름을 입력해 주십시오.';$('nm').focus();return}
  name=v;first=SW[i];
  s={day:1,food:20,en:50,mat:10,mo:50,lv:0,roster:[first.n],kin:null,rep:3,li:-1,dd:[],mon:0,hist:[],lost:[],kins:[],hp:{[first.n]:100},md:{[first.n]:70},sch:sched(),srt:0,smat:0,em:-1,eq:0,ks:[]};over=false;kinQ=null;iss=null;s.em=pickEm(s.sch);prog=0;last=Date.now();sor=null;sq=null;$('sq').style.display='none';$('iq').style.display='none';$('md').style.display='none';
  $('intro').style.display='none';$('game').style.display='flex';
  $('who').textContent='사니와 '+name+' · 초기도 '+first.n;
  $('log').innerHTML='';Q.length=0;clearTimeout(qt);qt=null;after=null;
  document.querySelectorAll('#acts .a').forEach(b=>b.style.display='');
  $('re').style.display=$('sr').style.display='none';
  log('사니와 ‘'+name+'’ 혼마루 착임. 30년간 역사를 지켜 내야 합니다.','i');
  log('초기도: '+first.n+' ('+first.d+')','g');
  log('시간은 자동으로 흘러갑니다. (1년 = 60초, 배속 가능) 오른쪽 도검 목록에서 근시를 지정하면 주기적으로 보고가 올라옵니다.','');log('사니와의 영력은 매년 약 5%씩 줄어듭니다. 보고 선택지로만 회복할 수 있고, 0이 되면 게임 오버입니다.','w');log('출진할 때마다 도검의 체력이 20% 줄어듭니다. 저하되면 2/3 이하 경상, 1/3 이하 중상이며, 중상 출진은 파괴 위험이 매우 큽니다.','w');log('도검마다 기분 수치가 있습니다. 기분이 낮으면 출진 물자가 줄고 불화가 생깁니다. 보고 선택지로 회복할 수 있습니다.','w');log('매년 한 번 출진 명령이 내려집니다. 출진할 도검을 1~6명 직접 골라 편성하며, 출진에는 10초가 걸립니다.','w');log('매년 한 번 단조 이벤트가 발생합니다. 세 자루 중 한 자루를 골라 옥강 6을 들여 단조하거나 단조하지 않을 수 있으며, 파괴된 도검은 다시 단조해야 돌아옵니다.','w');log('옥강은 단조, 시설 정비, 장비 개선, 출진 보급품에 쓸 수 있습니다. 체력과 기분은 시간이 지나면 조금씩 회복됩니다.','w');setSpd(1);
  render();
}
$('sw').innerHTML=SW.map((w,i)=>'<button onclick="pick('+i+')">'+w.n+'<small>'+w.d+'</small></button>').join('');
$('acts').innerHTML=[0,1,2,5,10].map(v=>'<button class="a" data-v="'+v+'" onclick="setSpd('+v+')">'+(v?v+'×':'⏸')+'</button>').join('')+'<button id="sr" onclick="summary()">결과 요약</button><button id="re" onclick="intro()">다시 시작 (R)</button>';
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape')$('sm').style.display='none';
  if(e.key==='Escape'&&kinQ!==null)return kinNo();
  if($('game').style.display!=='flex'||kinQ!==null||iss!==null||sq!==null)return;
  if(e.key===' '){e.preventDefault();setSpd(0)}
  if(e.key>='1'&&e.key<='4')setSpd([1,2,5,10][+e.key-1]);
  if((e.key==='r'||e.key==='R')&&over)intro();
});
intro();setInterval(loop,100);
</script>
</body>
