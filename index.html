<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>혼마루 30년 · 本丸三十年</title>
<style>
:root{--bg:#faf5f7;--panel:#f0e6eb;--fg:#3a2433;--dim:#8a6b7d;--line:#dcc8d2;--warn:#946200;--bad:#c0273d;--good:#1f7a46;--info:#b03a69;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#100e17;--panel:#1a1626;--fg:#efe6ee;--dim:#8b7f99;--line:#2d2640;--warn:#ffd27a;--bad:#ff7b8a;--good:#8fe3a8;--info:#f3a6c2}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#100e17;--panel:#1a1626;--fg:#efe6ee;--dim:#8b7f99;--line:#2d2640;--warn:#ffd27a;--bad:#ff7b8a;--good:#8fe3a8;--info:#f3a6c2}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR","Apple SD Gothic Neo",monospace}
#app{height:100%;max-width:720px;margin:0 auto;padding:10px;box-sizing:border-box}
#game,#intro{height:100%;display:flex;flex-direction:column;gap:8px}
#game{display:none}
#intro{justify-content:center}
h1{margin:0;font-size:18px;text-align:center;color:var(--info)}
#intro p{margin:0;text-align:center;color:var(--dim);font-size:12px}
input{font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;box-sizing:border-box;text-align:center}
#hint{color:var(--bad)!important;min-height:18px}
header{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:12px}
header b{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#st{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.c{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:center}
.c small{display:block;color:var(--dim);font-size:11px}
.c span{font-size:16px;font-weight:700}
.c.low span{color:var(--bad)}
#log{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.l{margin:0 0 2px}.l .d{color:var(--dim)}
.g{color:var(--good)}.w{color:var(--warn)}.b{color:var(--bad)}
.m{color:var(--dim);font-style:italic}.i{color:var(--info)}
#mid{flex:1;min-height:0;display:flex;gap:6px}
#mid #log{min-width:0}
#ros{width:112px;flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
#ros h6{margin:0;color:var(--dim);font-size:11px;font-weight:400;text-align:center}
#ros button{padding:5px 4px;font-size:12px;line-height:1.3}
#ros button.kin{border-color:var(--info);color:var(--info)}
.hw{color:var(--warn)!important}
.hb{color:var(--bad)!important}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:20}
#md .box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;margin:16px;max-width:320px;text-align:center}
#md p{margin:0 0 12px}
#md .r{display:flex;gap:8px}
#md .r button{flex:1;padding:10px}
#iq{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:20}
#iq .box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:14px;max-width:360px;width:100%;box-sizing:border-box;max-height:90%;overflow-y:auto}
#iq h4{margin:0 0 6px;color:var(--info);font-size:13px}
#iq p{margin:0 0 10px}
#iq button{display:block;width:100%;margin-bottom:6px;text-align:left;padding:8px 10px}
#iq button small{margin-top:2px}
#iq button:disabled{opacity:.4;cursor:default}
#sm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:30}
#sm .box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:14px;max-width:380px;width:100%;box-sizing:border-box;max-height:88%;overflow-y:auto}
#sm h4{margin:0 0 8px;font-size:15px;color:var(--info)}
#sm p{margin:0 0 8px;font-size:12px}
#sm .k{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;text-align:center;font-size:12px}
#sm .k div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px}
#sm ul{padding:0;margin:0 0 10px}
#sm li{list-style:none;margin:0 0 6px;font-size:12px}
#sm .q{color:var(--dim)}
#sm button{width:100%;padding:10px}
#acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#acts button.on{border-color:var(--info);color:var(--info);font-weight:700}
#pb{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
#pb i{display:block;height:100%;width:0;background:var(--info)}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 4px;cursor:pointer;text-align:center}
button:active{background:var(--line)}
button small{display:block;color:var(--dim);font-size:11px}
#re{display:none;grid-column:3/-1;padding:14px;font-weight:700}
#sr{display:none;grid-column:1/3;padding:14px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2ecdf;--panel:#faf6ec;--fg:#2a2520;--dim:#7d7261;--line:#cfc2a8;--acc:#b3342a;--good:#3e6b47;--warn:#96661a;--bad:#b3342a;--info:#2b4a7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151c;--panel:#211e27;--fg:#e9e2d4;--dim:#948b7c;--line:#3c3745;--acc:#e0624a;--good:#8fbf8a;--warn:#e3b655;--bad:#ef7b6c;--info:#8fb1e0}}
:root[data-theme="dark"]{--bg:#17151c;--panel:#211e27;--fg:#e9e2d4;--dim:#948b7c;--line:#3c3745;--acc:#e0624a;--good:#8fbf8a;--warn:#e3b655;--bad:#ef7b6c;--info:#8fb1e0}
body{font:14px/1.65 'Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;background-color:var(--bg);background-image:radial-gradient(circle at 15% 8%,rgba(160,130,80,.08),transparent 45%),repeating-linear-gradient(0deg,rgba(120,100,70,.035) 0 1px,transparent 1px 3px)}
#game::before,#intro::before{content:'';flex:none;height:10px;background:radial-gradient(circle at 50% 100%,transparent 55%,var(--line) 56%,var(--line) 63%,transparent 64%) 0 0/20px 10px}
h1{font-size:21px;letter-spacing:.1em}
h1 small{display:block;font-size:11px;letter-spacing:.7em;color:var(--acc);margin-bottom:2px}
header{border-bottom:1px solid var(--line);padding-bottom:4px}
#who::before{content:'本';display:inline-block;background:var(--acc);color:#fff;padding:0 4px;margin-right:6px;font-size:11px;border-radius:1px}
.c,#log,button,input{border-radius:2px}
.c{background:var(--panel);box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 3px var(--line);padding:5px 4px}
.c span{font-size:18px}
.c.low span{color:var(--acc)}
#log{background:var(--panel);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line);padding:10px 12px}
.l{padding:3px 0 3px 8px;border-left:2px solid transparent;border-bottom:1px dotted var(--line);opacity:.68;animation:inl .4s ease}
.l.new{opacity:1;border-left-color:var(--acc);font-weight:600}
.l .d{display:inline-block;min-width:4.7em;font-size:11px;font-weight:400}
@keyframes inl{from{opacity:0;transform:translateY(5px)}}
button{background:var(--panel);transition:border-color .15s,background .15s}
button:hover{border-color:var(--acc)}
#acts button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ros h6{color:var(--acc)}
#ros button{border-left:3px solid var(--line)}
#ros button.kin{border-color:var(--acc);color:var(--acc)}
#mode{display:flex;gap:6px}
#mode button{flex:1;padding:8px}
#mode button.on{border-color:var(--acc);background:var(--acc);color:#fff;font-weight:700}
#mode button#mH.on{border-color:#a33;background:#a33}
#sw button{border-left:4px solid var(--acc);padding:10px 12px;text-align:left}
#pb{background:var(--line)}
#pb i{background:var(--acc)}
input{font-family:inherit}
#md .box,#iq .box,#sm .box{background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line),0 8px 30px rgba(0,0,0,.35)}
#md,#iq,#sm{background:rgba(40,30,20,.55)}
#iq h4,#sm h4{color:var(--acc);letter-spacing:.06em}
#iq h4::before{content:'【報】 ';color:var(--acc)}
#iq h4.ask::before{content:'【問】 '}
#iq h4.forge::before{content:'【鍛】 '}
#iq h4.story::before{content:'【談】 '}
#sq{display:none;position:fixed;inset:0;background:rgba(40,30,20,.55);align-items:center;justify-content:center;z-index:20}
#sq .box{background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line),0 8px 30px rgba(0,0,0,.35);padding:14px;margin:14px;max-width:360px;width:100%;box-sizing:border-box;max-height:90%;overflow-y:auto}
#sq h4{margin:0 0 6px;color:var(--acc);font-size:14px;letter-spacing:.06em}
#sq h4::before{content:'【出陣】 '}
#sq p{margin:0 0 8px;font-size:12px}
#sq button{display:block;width:100%;margin-bottom:6px;text-align:left;padding:8px 10px}
#sq button.sel{border-color:var(--acc);background:var(--acc);color:#fff}
#sq button.sel small{color:#fff}
#sq #sqg{text-align:center;font-weight:700}
#sq #sqg:disabled{opacity:.4}
</style>
<style>
body{font-family:'Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo','Apple SD Gothic Neo',serif}
header{align-items:center}
header b{min-width:0}
.hr{display:flex;gap:6px;align-items:center;flex:none}
#ctn{display:flex;flex-direction:column;gap:4px}
#ctn:empty{display:none}
#ctn button{border-left:4px solid var(--info);padding:10px 12px;text-align:left;font-weight:700}
#ctn button small{font-weight:400}
#ctn p{margin:0;font-size:11px}
#recb{padding:8px;font-size:12px;color:var(--dim)}
#sm ul.rec li{margin:0 0 4px}
#sm ul.rec button,#sm .bk,#sm .clr{text-align:left;padding:8px 10px;margin-bottom:6px}
#sm .bk{width:auto;padding:4px 10px;font-size:12px}
#sm .clr{text-align:center;color:var(--bad);font-size:12px}
</style>
<style>
/* 계절감: html[data-season]에 따라 포인트 색, 배경 기운, 떨어지는 입자가 바뀝니다 */
:root[data-season="spring"]{--acc:#c0506a;--pc:#f2b5c4;--tint:rgba(240,170,190,.20)}
:root[data-season="summer"]{--acc:#2f7f6a;--pc:#c9a227;--tint:rgba(90,170,140,.16)}
:root[data-season="autumn"]{--acc:#b4481e;--pc:#d9772b;--tint:rgba(220,130,50,.18)}
:root[data-season="winter"]{--acc:#40607f;--pc:#aebfd4;--tint:rgba(150,180,215,.22)}
@media (prefers-color-scheme:dark){
:root[data-season="spring"]:not([data-theme="light"]){--acc:#f093ab;--pc:#f6bccb;--tint:rgba(240,150,180,.12)}
:root[data-season="summer"]:not([data-theme="light"]){--acc:#6fcfa6;--pc:#e0e88a;--tint:rgba(90,200,150,.10)}
:root[data-season="autumn"]:not([data-theme="light"]){--acc:#f08a55;--pc:#f0a65a;--tint:rgba(240,140,70,.12)}
:root[data-season="winter"]:not([data-theme="light"]){--acc:#9cbde3;--pc:#e6eef8;--tint:rgba(150,185,230,.12)}
}
:root[data-theme="dark"][data-season="spring"]{--acc:#f093ab;--pc:#f6bccb;--tint:rgba(240,150,180,.12)}
:root[data-theme="dark"][data-season="summer"]{--acc:#6fcfa6;--pc:#e0e88a;--tint:rgba(90,200,150,.10)}
:root[data-theme="dark"][data-season="autumn"]{--acc:#f08a55;--pc:#f0a65a;--tint:rgba(240,140,70,.12)}
:root[data-theme="dark"][data-season="winter"]{--acc:#9cbde3;--pc:#e6eef8;--tint:rgba(150,185,230,.12)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#fx::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,var(--tint,transparent),transparent 55%)}
.fxp{position:absolute;display:block;left:var(--x);top:-24px;width:var(--s);height:var(--s);background:var(--pc);opacity:0;animation:fxfall var(--d) linear var(--dl) infinite}
.fxp.spring{border-radius:70% 0 70% 0}
.fxp.autumn{border-radius:0 80% 0 80%}
.fxp.winter{border-radius:50%;box-shadow:0 0 4px var(--pc)}
.fxp.summer{top:var(--y);border-radius:50%;box-shadow:0 0 8px 2px var(--pc);animation:fxflit var(--d) ease-in-out var(--dl) infinite}
@keyframes fxfall{0%{transform:translate3d(0,-4vh,0) rotate(0);opacity:0}10%{opacity:.75}90%{opacity:.75}100%{transform:translate3d(var(--dx),108vh,0) rotate(360deg);opacity:0}}
@keyframes fxflit{0%,100%{transform:translate3d(0,0,0);opacity:0}25%{opacity:.9}50%{transform:translate3d(var(--dx),-6vh,0);opacity:.25}75%{opacity:.9}}
:root[data-season="spring"] #day::before{content:'春 ';color:var(--acc)}
:root[data-season="summer"] #day::before{content:'夏 ';color:var(--acc)}
:root[data-season="autumn"] #day::before{content:'秋 ';color:var(--acc)}
:root[data-season="winter"] #day::before{content:'冬 ';color:var(--acc)}
#day::before{font-weight:700}
#pb i{transition:background-color .8s}
@media (prefers-reduced-motion:reduce){.fxp{display:none}}
</style>
<style>
#pb{background:linear-gradient(90deg,rgba(150,180,215,.38) 0 16.67%,rgba(240,170,190,.45) 16.67% 41.67%,rgba(90,170,140,.42) 41.67% 66.67%,rgba(220,130,50,.42) 66.67% 91.67%,rgba(150,180,215,.38) 91.67% 100%)}
#game::before,#intro::before{background:radial-gradient(circle at 50% 100%,transparent 55%,var(--acc) 56%,var(--acc) 63%,transparent 64%) 0 0/20px 10px;opacity:.5;transition:opacity .8s}
header{border-bottom-color:var(--acc)}
.l .d{color:var(--acc);opacity:.9}
#iq h4.deal::before{content:'【密】 '}
</style>

</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div id="app">
  <div id="intro">
    <h1><small>本丸</small><span id="h1t"></span></h1>
    <p id="lead"></p>
    <input id="nm" maxlength="8" autocomplete="off">
    <p id="hint"></p>
    <div id="ctn"></div>
    <div id="mode"><button id="mN" onclick="setMode(0)"></button><button id="mH" onclick="setMode(1)"></button></div>
    <p id="modeD"></p>
    <p id="pickp"></p>
    <div id="sw" style="display:flex;flex-direction:column;gap:6px"></div>
    <button id="recb" onclick="records()"></button>
  </div>
  <div id="game">
    <header><b id="who"></b><span class="hr"><span id="day"></span></span></header>
    <div id="pb"><i id="pf"></i></div>
    <div id="st"></div>
    <div id="mid"><div id="log" aria-live="polite"></div><div id="ros"></div></div>
    <div id="acts"></div>
  </div>
</div>
<div id="sq"><div class="box"><h4 id="sqh"></h4><p id="sqt"></p><div id="sql"></div><button id="sqg" onclick="sqGo()"></button></div></div>
<div id="sm"><div class="box"><h4 id="sh"></h4><div id="sb"></div><button id="smc" onclick="$('sm').style.display='none'"></button></div></div>
<div id="iq"><div class="box"><h4 id="ih"></h4><p id="it"></p><div id="ic"></div></div></div>
<div id="md"><div class="box"><p id="mq"></p><div class="r"><button id="kyes" onclick="kinYes()"></button><button id="kno" onclick="kinNo()"></button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const MAX=30,FC=9,MS=5;
const pad=x=>String(x).padStart(2,'0');
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const IDS=["야만바기리 쿠니히로", "카슈 키요미츠", "하치스카 코테츠", "무츠노카미 요시유키", "카센 카네사다", "미카즈키 무네치카", "츠루마루 쿠니나가", "오오쿠리카라", "이치고 히토후리", "히젠 타다히로", "소우자 사몬지", "헤시키리 하세베", "야만바기리 쵸우기", "이즈미노카미 카네사다", "호리카와 쿠니히로", "고코타이", "사요 사몬지"];
const L={
ko:{
SWD:["출진 사고 확률 대폭 감소", "연회 신뢰도 +6 추가", "밭일 수확 +2", "출진 옥강 +2", "휴식 신뢰도 +3, 영력 감소 완화"],
EF:{food:'군량',en:'영력',mat:'옥강',mo:'신뢰도',lv:'강화',gi:'기분',go:'상대 기분',gain:'합류',deal:'출진 중단 · 위험 이벤트 차단',hp:'체력',ha:'전원 체력',ma:'전원 기분',eq:'장비'},
IS:[
[n=>'['+n+'] 연일 출진으로 지쳐 보입니다.',[['출진을 쉬게 합니다',{mo:10,mat:-3},'출진을 쉬게 했습니다.'],['격려하고 계속 보냅니다',{mo:-5,mat:4},'격려 후 출진을 이어갔습니다.'],['연회로 위로합니다',{mo:15,food:-4},'연회를 열어 위로했습니다.']]],
[n=>'['+n+'] 다른 도검과 훈련 방식을 두고 다투었습니다.',[['직접 중재합니다',{en:-3,mo:6},'사니와가 직접 중재에 나섰습니다.'],['합동 훈련으로 가립니다',{mat:-5,mo:4,food:-1},'합동 훈련으로 승부를 냈습니다.'],['스스로 풀게 둡니다',{mo:-6,en:2},'당사자들에게 맡겨 두었습니다.']]],
[n=>'['+n+'] 식사량에 불만이 있다고 합니다.',[['식사량을 줄여 비축합니다',{food:3,mo:-8},'식사량을 줄였습니다.'],['특식을 내줍니다',{food:-4,mo:12},'특식을 마련했습니다.'],['직접 밭을 돌보게 합니다',{en:-2,food:4,mo:-3},'밭일을 맡겼습니다.']]],

'카센 카네사다':[['[카센 카네사다] 첫 주인 호소카와 타다오키가 무예뿐 아니라 다도와 시가에도 능했다던 이야기를 떠올리며, 요즘 혼마루에서 풍류를 즐길 여유가 있을지 아쉬워하고 있는 것 같습니다.',[['차를 마시며 시를 읊는다고 말해 줍니다',{food:-1,mo:1,gi:12},'차를 마시며 시를 읊는다고 이야기했습니다.'],['풍류를 즐길 여유가 없다고 말해 줍니다',{mo:-1,gi:-5},'풍류를 즐길 여유가 없다고 답했습니다.'],['함께 시를 지어 보자고 말해 줍니다',{en:-1,mo:2,gi:14},'함께 시를 지어 보자고 했습니다.']]]],

'이치고 히토후리':[['[이치고 히토후리] 오사카 성의 불길 속에서 한 번 소실되었다가 다시 벼려졌다던 지난 일을 떠올리며, 시련을 겪은 뒤에도 사람이 다시 일어설 수 있는지 고민하고 있는 것 같습니다.',[['믿는다며 격려합니다',{mo:2,gi:12},'다시 일어설 수 있다며 격려했습니다.'],['쉬지 않으면 무너진다고 말해 줍니다',{food:-1,mo:1,gi:5},'쉬지 않으면 무너진다고 말했습니다.'],['시련은 없는 편이 낫다고 말해 줍니다',{mo:-1,gi:-4},'시련은 없는 편이 낫다고 말했습니다.']]]],

let P=L.ko,U=UI.ko;
let hard=0;try{hard=localStorage.getItem('hm30-hard')==='1'?1:0}catch(e){}
const H=()=>!!(s&&s.hard);
function meta(t){
  if(!s||over||(s.mx||0)>=2)return false;
  s.mx=(s.mx||0)+1;log(t,'m');return true;
}
const pick1=a=>a[R(0,a.length-1)];
const fallSeen=()=>{try{return localStorage.getItem('hm30-fall')==='1'}catch(e){return false}};
let pat=0;
const fid=()=>s.roster.includes(first.n)?first.id:'';
function setMode(v){
  hard=v;try{localStorage.setItem('hm30-hard',v?'1':'0')}catch(e){}
  updMode();
}
function updMode(){
  $('mN').classList.toggle('on',!hard);$('mH').classList.toggle('on',!!hard);
  $('mN').textContent=U.modeN;$('mH').textContent=U.modeH;$('modeD').textContent=U.modeD[hard?1:0];
}

let s,over,name='',first,kinQ=null,iss=null,isd=null,LG=[],smv=null;
const C=()=>s.roster.length;
const st=n=>{const h=s.hp[n];return h<=33?2:h<=66?1:0};
const score=()=>C()*20+s.food+s.en+s.mat+s.lv*5+Math.floor(s.mo/5);
const fmtD=x=>x[0]+' ('+x[1]+U.yr+')';

const Q=[];let qt=null,after=null;
function log(t,c){
  Q.push([U.date(s.day,s.mon+1),t,c||'']);
  if(!qt)pump();
}
function whenIdle(f){setTimeout(()=>{if(!qt&&!Q.length)f();else after=f},0)}
function pump(){
  const q=Q.shift();
  if(!q){qt=null;const f=after;after=null;if(f)f();return}
  put(q[0],q[1],q[2]);
  qt=setTimeout(pump,Math.max(70,700/spd));
}
function put(lb,t,c){
  const pv=$('log').querySelector('.new');if(pv)pv.classList.remove('new');
  const d=document.createElement('div');d.className='l new '+c;
  d.innerHTML='<span class="d">'+lb+'</span> '+t;
  LG.push([lb,t,c]);if(LG.length>80)LG.shift();
  const L=$('log');L.appendChild(d);
  while(L.children.length>80)L.firstChild.remove();
  L.scrollTop=1e9;
}
function ros(){
  $('ros').innerHTML='<h6>'+U.kinH+': '+(s.kin?s.kin:U.unset)+'</h6>'+s.roster.map((n,i)=>'<button class="'+(n===s.kin?'kin':'')+'" onclick="askKin('+i+')">'+(n===s.kin?'★ ':'')+n+(n===first.n?'<small>'+U.firstTag+'</small>':'')+'<small class="'+['','hw','hb'][st(n)]+'">'+U.hpL+' '+s.hp[n]+(st(n)?' '+U.inj[st(n)]:'')+'</small><small class="'+(s.md[n]<30?'hb':s.md[n]<60?'hw':'')+'">'+U.moodL+' '+s.md[n]+'</small></button>').join('');
}
function askKin(i){
  if(over||kinQ!==null||iss!==null)return;
  const n=s.roster[i];
  if(n===s.kin){log(U.already(n),'w');return}
  kinQ=n;$('mq').textContent=U.confirmKin(n);$('md').style.display='flex';
}
function kinYes(){
  if(spq){spq=0;$('md').style.display='none';return finish('sp',true)}
  const n=kinQ;kinQ=null;$('md').style.display='none';
  if(!n||!s.roster.includes(n))return;
  s.kin=n;s.kins.push([n,s.day]);const un=(P.KS[n]||[]).some((e,i)=>!s.ks.includes(n+i));s.ksNew=un;if(un)s.rep=Math.min(s.rep,s.day);log(U.kinSet(n),'i');render();
}
function kinNo(){if(spq){spq=0;$('md').style.display='none';return finish('win',true)}kinQ=null;$('md').style.display='none'}
const fx=e=>Object.keys(e).map(k=>k==='deal'?P.EF[k]:P.EF[k]+' '+(k==='gain'?e[k]:(e[k]>0?'+':'')+e[k])).join(' · ');
const need=c=>c[3]&&Object.keys(c[1]).some(k=>c[1][k]<0&&(k==='food'||k==='mat')&&-c[1][k]>s[k]);
const eff=c=>{const e=Object.assign({},c[1]);if(e.gi===undefined){const m=e.mo||0;e.gi=m>=4?m*4:m<=-4?m*2:0}if(!e.gi)delete e.gi;return e};

// 이벤트 창은 "무슨 이벤트인지"만 기억해 두고, 글자는 그릴 때마다 현재 언어로 만듭니다.
function build(d){
  if(d.t==='DEAL'){const x=Math.floor(s.mo*0.8);return [U.dealT+(fallSeen()?U.dealMeta:''),[[U.dealYes,{mo:-x,gi:0,deal:1},U.dealYesD],[U.dealNo,{},U.dealNoD]],U.dealH,'deal']}
  if(d.t==='DLS'){const x=P.DLS[d.sea][d.k];return [x[0](d.n,d.o),x[1],U.askH(d.n),'ask']}
  if(d.t==='DL'){const x=P.DL[d.k];return [x[0](d.n,d.o),x[1],U.askH(d.n),'ask']}
  if(d.t==='DI')return [U.discordRep(d.n,d.ob),P.DI,U.repH(d.kin),''];
  if(d.t==='KS'){const x=P.KS[d.kin][d.i];return [x[0],x[1],U.storyH(d.kin),'story']}
  if(d.t==='DS'){const x=P.DS[d.n];return ['['+d.n+'] '+x[0],x[1],U.repH(d.kin),'']}
  if(d.t==='IW'||d.t==='IS'){const x=P[d.t][d.k];return [x[0](d.n),x[1],U.repH(d.kin),'']}
  if(d.t==='PR'){const x=P.PR[d.k];return [x[2],x[3],U.prH(x[0],x[1]),'story']}
  if(d.t==='FG')return [U.forgeT(FC,s.mat),d.pk.map(n=>[U.forgeC(n),{mat:-FC,gain:n},U.forgeD(n)]).concat([[U.forgeNo,{},U.forgeNoD]]),U.forgeH,'forge'];
}
const dis=c=>isd.t==='FG'?!!(c[1].mat&&-c[1].mat>s.mat):need(c);
function draw(){

function openIss(d){isd=d;draw();save();whenIdle(()=>{$('iq').style.display='flex'})}

function ask(){
  const n=s.roster[R(0,C()-1)],ot=s.roster.filter(x=>x!==n),o=ot.length?ot[R(0,ot.length-1)]:n;
  if(Math.random()<0.4){const si=seasonOf(s.mon),sl=P.DLS[si],k2=R(0,sl.length-1);if(!(sl[k2][2]&&C()<2)){s.tgt=n;s.oth=o;log(U.askLog(n),'i');openIss({t:'DLS',k:k2,sea:si,n,o});return}}
  let k;do k=R(0,P.DL.length-1);while(k===s.ld||(P.DL[k][2]&&C()<2));
  s.ld=k;s.tgt=n;s.oth=o;
  log(U.askLog(n),'i');
  openIss({t:'DL',k,n,o});
}
function pairEv(){
  const pr=s.pr||(s.pr=[]),av=[];
  P.PR.forEach((x,k)=>{if(!pr.includes(k)&&s.roster.includes(x[0])&&s.roster.includes(x[1]))av.push(k)});
  if(!av.length||Math.random()>=0.12)return false;
  const k=av[R(0,av.length-1)],x=P.PR[k];pr.push(k);
  s.tgt=x[0];s.oth=x[1];
  log(U.prLog(x[0],x[1]),'i');openIss({t:'PR',k});return true;
}
function report(){
  const lw=s.roster.filter(x=>s.md[x]<35&&x!==s.kin),dc=C()>1&&lw.length>0&&Math.random()<0.5;
  const o=s.roster.filter(x=>x!==s.kin);
  let n=dc?lw[R(0,lw.length-1)]:(o.length?o[R(0,o.length-1)]:s.kin);
  s.tgt=n;
  const kin=s.kin,kl=(P.KS[kin]||[]).map((e,i)=>i).filter(i=>!s.ks.includes(kin+i));
  const d=P.DS[n],ot=s.roster.filter(x=>x!==n),ob=ot[R(0,ot.length-1)];
  let D;
  if(dc&&!(kl.length&&s.ksNew))D={t:'DI',n,ob,kin};
  else if(kl.length&&(s.ksNew||Math.random()<0.45)){const i=kl[R(0,kl.length-1)];s.ks.push(kin+i);s.ksNew=false;D={t:'KS',kin,i};s.tgt=kin}
  else if(d&&!s.dd.includes(n)&&Math.random()<0.5){s.dd.push(n);D={t:'DS',n,kin}}
  else if(Math.random()<0.5){let k;do k=R(0,P.IW.length-1);while(k===s.lw);s.lw=k;D={t:'IW',k,n,kin}}
  else{let k;do k=R(0,P.IS.length-1);while(k===s.li);s.li=k;D={t:'IS',k,n,kin}}
  openIss(D);
  log(U.repLog(kin),'w');
}
function choose(i){
  const c=iss[1][i],e=eff(c),g=s.tgt;iss=null;isd=null;$('iq').style.display='none';
  s.hist.push([s.cur[0],s.cur[1],c[0],e]);
  for(const k in e){if(k==='lv')s.lv+=e[k];else if(k==='gi')s.md[g]=Math.max(0,Math.min(100,s.md[g]+e[k]));else if(k==='go'){const q=s.oth;if(q&&s.md[q]!==undefined)s.md[q]=Math.max(0,Math.min(100,s.md[q]+e[k]))}else if(k==='gain')addSword(e[k]);else if(k==='deal')s.deal=1;else if(k==='hp'){if(g&&s.hp[g]!==undefined)s.hp[g]=Math.max(1,Math.min(100,s.hp[g]+e[k]))}else if(k==='ha')s.roster.forEach(x=>{s.hp[x]=Math.max(1,Math.min(100,s.hp[x]+e[k]))});else if(k==='ma')s.roster.forEach(x=>{s.md[x]=Math.max(0,Math.min(100,s.md[x]+e[k]))});else if(k==='eq')s.eq=(s.eq||0)+e[k];else s[k]+=e[k]}
  clamp();log(c[2]+(fx(e)?' ('+fx(e)+')':''),'i');

function clamp(){['food','en','mat'].forEach(k=>{if(s[k]<0)s[k]=0});s.mo=Math.max(0,Math.min(100,s.mo));s.en=Math.min(100,s.en)}

function lose(w,fs){
  const hk=H()&&!!w&&s.roster.includes(w);
  if(C()>1&&(w!==s.roster[0]||hk)){const n=w?s.roster.splice(s.roster.indexOf(w),1)[0]:s.roster.splice(R(1,C()-1),1)[0];delete s.hp[n];delete s.md[n];s.mo-=H()?25:20;if(fs)s.brk=(s.brk||0)+1;s.lost.push([n,s.day]);log(n===first.n?U.firstBroke(n):U.broke(n),'b');if(s.kin===n){s.kin=null;log(U.kinGone,'w')}}
  else if(hk){const n=s.roster.splice(0,1)[0];delete s.hp[n];delete s.md[n];if(fs)s.brk=(s.brk||0)+1;s.lost.push([n,s.day]);s.kin=null;log(n===first.n?U.firstBroke(n):U.broke(n),'b');finish('last')}
  else{const t=s.roster[0];s.mo-=15;s.hp[t]=Math.min(s.hp[t],10);log(t===first.n?U.firstHurt(t):U.lastHurt(t),'b')}
}
let sq=null,sor=null,sqp=[],sqs=false;
let spd=1,paused=false,prog=0,last=Date.now();
function work(){
  const n=s.roster[R(0,C()-1)];
  let a=P.W[R(0,P.W.length-1)];
  if(Math.random()<0.22){const ws=P.WS[seasonOf(s.mon)];a=ws[R(0,ws.length-1)]}
  if(P.PL[n]&&Math.random()<0.25)a=P.PL[n];
  if(a[2]==='x'&&st(n)===2&&Math.random()<0.6){
    s.hp[n]=Math.min(100,s.hp[n]+8);
    log(U.rest(n),'i');
    return;
  }
  const e={},t=a[2]||'',id=fid();
  for(const k in a[1]){const x=a[1][k];e[k]=Array.isArray(x)?R(x[0],x[1]):x}
  if(e.mo>0)e.mo=Math.ceil(e.mo/2);
  if(t==='x'){const m=s.md[n];e.mat=Math.max(1,Math.round(e.mat*(m>=60?1:m>=30?0.7:0.4)))}
  if(t==='f')e.food+=s.lv+(id==='h'?2:0);
  if(t==='x')e.mat+=(id==='m'?2:0);
  if(t==='p'&&id==='k')e.mo+=6;
  if(t==='c'&&id==='s')e.mo+=3;
  if(e.mat<0&&s.mat<1){e.mat=0;if(e.en)e.en=Math.floor(e.en/2)}
  if(H())['food','mat'].forEach(k=>{if(e[k]>1)e[k]=Math.ceil(e[k]*0.8)});
  for(const k in e){if(!e[k])delete e[k];else s[k]+=e[k]}
  const h0=st(n);let hx='';
  if(t==='c'){s.hp[n]=Math.min(100,s.hp[n]+6);s.md[n]=Math.min(100,s.md[n]+4);hx=U.hxC}
  if(t==='p'){s.roster.forEach(x=>{s.md[x]=Math.min(100,s.md[x]+3)});hx=U.hxP}
  if(t==='q'){[n,s.roster[R(0,C()-1)]].forEach(x=>{if(x!==s.kin)s.md[x]=Math.max(0,s.md[x]-8)})}
  if(t==='x'){const m=s.md[n];s.hp[n]=Math.max(1,s.hp[n]-20);hx=U.hxX(m);if(n!==s.kin)s.md[n]=Math.max(0,s.md[n]-3)}
  const f=[fx(e),hx].filter(Boolean).join(' · '),cls=e.mo<0?'w':(e.food>0||e.en>0||e.mat>0?'g':'i');
  log(n+': '+a[0]+(f?' ('+f+')':''),cls);
  if(t==='x'){
    const h1=st(n);
    if(h1>h0)log(U.injured(n,h1),'w');
    if(Math.random()<(h0===2?(id==='y'?0.2:0.3):(id==='y'?0.01:0.03))*(H()?1.5:1))lose(n);
  }
}
function month(){
  if(spd>=10&&!paused){s.fm=(s.fm||0)+1;if(s.fm>=36&&!s.ff&&meta(pick1(U.mFast)))s.ff=1}
  if(sor){sortieTick();return}
  if((s.brk||0)>=7&&!s.deal0){s.deal0=1;prog+=MS;openIss({t:'DEAL'});return}
  if(s.sch.includes(s.mon)&&!s.deal){s.sch=s.sch.filter(x=>x!==s.mon);prog+=MS;openSquad();return}
  if(s.em===s.mon){s.em=-1;if(forgeEvent()){prog+=MS;return}}
  const k=Math.ceil(C()/2);
  for(let i=0;i<k&&!over;i++)work();
  if(over)return;
  s.roster.forEach(x=>{s.hp[x]=Math.min(100,s.hp[x]+1);s.md[x]=Math.min(100,s.md[x]+1)});
  if(C()>1)s.roster.forEach(x=>{
    const m=s.md[x];
    if(x!==s.kin&&m<35&&Math.random()<(m<15?0.3:0.2)*(H()?1.3:1)){
      const ot=s.roster.filter(y=>y!==x),y=ot[R(0,ot.length-1)];
      s.mo-=3;s.md[x]=Math.max(0,s.md[x]-5);if(y!==s.kin)s.md[y]=Math.max(0,s.md[y]-5);
      log(U.discord(x,y),'b');
    }
  });
  clamp();
  if(s.mo<=0)return finish('mo');
  if(s.mon<11&&iss===null){if(!pairEv()&&Math.random()<0.14)ask()}
  if(s.mon===11){
    yearEnd();
    if(over)return;
    s.mon=0;s.day++;s.sch=sched();s.em=pickEm(s.sch);
  }else s.mon++;
  render();
}
function loop(){
  const t=Date.now(),dt=Math.min(250,t-last)/1000;last=t;
  if(!s||over||paused||kinQ!==null||iss!==null||sq!==null||$('game').style.display!=='flex')return;
  prog+=dt*spd;
  while(prog>=MS&&!over&&iss===null&&sq===null){prog-=MS;month()}
  $('pf').style.width=Math.min(100,(s.mon*MS+prog)/(12*MS)*100)+'%';
}
// 결과 요약은 snap() 데이터로 그립니다. 끝난 판의 기록도 같은 모양으로 보여 줍니다.
function snap(){return {at:Date.now(),name,fi:SW.indexOf(first),win:s.win,msg:s.msg,day:s.day,sc:score(),n:C(),mo:s.mo,en:s.en,food:s.food,kins:s.kins,hard:s.hard?1:0,srt:s.srt||0,smat:s.smat||0,roster:s.roster.map(x=>[x,s.hp[x],s.md[x]]),lost:s.lost,hist:s.hist}}

function sched(){return [R(0,9)]}
function openSquad(){

}
function renderSq(){

function togSup(){if(s.mat>=6||sqs){sqs=!sqs;renderSq()}}
function togSq(i){const n=s.roster[i],k=sqp.indexOf(n);if(k>=0)sqp.splice(k,1);else if(sqp.length<6)sqp.push(n);renderSq()}
function sqGo(){
  if(sqp.length<1)return;
  const sup=sqs&&s.mat>=6;if(sup)s.mat-=6;
  sor={squad:sqp.slice(),ph:0,sup,era:R(0,4)};

function sortieTick(){
  const q=sor.squad;
  if(sor.ph===0){
    log(U.sortieOut(q.join(U.sep),U.ERA[sor.era]),'i');
    log(U.engage,'w');
    sor.ph=1;s.mon++;render();return;
  }
  let mat=0,low=false;
  q.forEach(n=>{const m=s.md[n];if(m<60)low=true;mat+=Math.max(1,Math.round(R(2,4)*(m>=60?1:m>=30?0.7:0.4)))});
  if(fid()==='m'&&q.includes(first.n))mat+=2;
  if(sor.sup)mat=Math.round(mat*1.3);
  if(H())mat=Math.max(1,Math.round(mat*0.8));
  const hurt=Math.max(6,20-3*(s.eq||0)-(sor.sup?8:0))+(H()?3:0);
  s.mat+=mat;s.srt++;s.smat+=mat;
  log(U.back(mat,q.length,hurt,sor.sup,low),'g');
  q.forEach(n=>{
    if(s.hp[n]===undefined)return;
    const h0=st(n);
    s.hp[n]=Math.max(1,s.hp[n]-hurt);
    if(n!==s.kin)s.md[n]=Math.max(0,s.md[n]-3);
    const h1=st(n);
    if(h1>h0)log(U.injured(n,h1),'w');
    if(Math.random()<(h0===2?(fid()==='y'?0.2:0.3):(fid()==='y'?0.01:0.03))*(H()?1.5:1))lose(n,1);
  });
  sor=null;s.mon++;clamp();
  if(over)return;

function pickEm(sc){
  const bad=[];sc.forEach(m=>{bad.push(m,m+1)});
  const ok=[];for(let i=0;i<=10;i++)if(!bad.includes(i))ok.push(i);
  return ok[R(0,ok.length-1)];
}
function addSword(n){

function forgeEvent(){

const EV=[

 ()=>{const n=R(3,6);s.en-=n;log(U.ev[1](n),'w')},

 ()=>{const f=R(5,9),m=R(2,4);s.food+=f;s.mat+=m;log(U.ev[3](f,m),'g')},
 ()=>{s.mo+=8;log(U.ev[4](),'i')},
 ()=>{s.mo+=8;log(U.ev[5](),'i')},

function yearEnd(){
  const fc=H()?Math.ceil(C()*2.25)+1:C()*2+1,ne=Math.floor(s.en*(fid()==='s'?(H()?0.96:0.97):(H()?0.94:0.95))),ec=s.en-ne;
  s.food-=fc;s.en=ne;
  log(U.yearEnd(fc,ec),'');
  if(s.food<0){s.food=0;s.mo-=H()?15:10;log(U.starve,'b');if(!s.deal)lose()}
  if(Math.random()<(H()?0.7:0.55)){const ix=s.deal?[1,3,4,5,6]:null;let k=ix?ix[R(0,ix.length-1)]:R(0,EV.length-1);if(H()&&k>=3&&k<=5&&Math.random()<0.5){const bd=s.deal?[1,6]:[0,1,2,6];k=bd[R(0,bd.length-1)]}EV[k]()}
  s.mo+=2;
  s.roster.forEach(x=>{if(x!==s.kin)s.md[x]=Math.max(0,s.md[x]-(H()?6:4))});
  clamp();
  if(s.en<=0)return finish('en');
  if(s.mo<=0)return finish('mo');
  if(s.day>=MAX){if(s.deal)return finish('fall');if(C()===1)return endAsk();return finish('win',true)}
  if(s.kin&&s.day>=s.rep){s.rep=s.day+R(1,2);report()}
}

  if(!v){$('hint').textContent=U.needName;$('nm').focus();return}
  name=v;first=SW[i];
  s={day:1,food:20,en:50,mat:10,mo:50,lv:0,roster:[first.n],kin:null,rep:3,li:-1,lw:-1,ld:-1,dd:[],mon:0,hist:[],lost:[],kins:[],hp:{[first.n]:100},md:{[first.n]:70},sch:sched(),srt:0,smat:0,em:-1,eq:0,ks:[],ksNew:false,pr:[],hard:hard};if(hard){s.food=14;s.en=44;s.mat=6;s.mo=45}over=false;kinQ=null;iss=null;isd=null;s.em=pickEm(s.sch);prog=0;last=Date.now();sor=null;sq=null;$('sq').style.display='none';$('iq').style.display='none';$('md').style.display='none';
  $('intro').style.display='none';$('game').style.display='flex';
  $('log').innerHTML='';LG=[];Q.length=0;clearTimeout(qt);qt=null;after=null;
  document.querySelectorAll('#acts .a').forEach(b=>b.style.display='');
  $('re').style.display=$('sr').style.display='none';
  U.intro(esc(name),first.n,P.SWD[i]).forEach(x=>log(x[0],x[1]));
  pat=0;if(fallSeen())meta(pick1(U.mFall));
  if(hard)log(U.hardIntro[0],U.hardIntro[1]);
  setSpd(1);
  render();
}
// 화면의 고정 문구와 열려 있는 창을 다시 그립니다.
function applyUI(){
  document.title=U.title;
  $('h1t').textContent=U.h1;$('lead').textContent=U.lead;$('nm').placeholder=U.ph;$('pickp').textContent=U.pickp;
  if($('hint').textContent)$('hint').textContent=U.needName;
  $('sw').innerHTML=SW.map((w,i)=>'<button onclick="pick('+i+')">'+w.n+'<small>'+P.SWD[i]+'</small></button>').join('');
  $('sqh').textContent=U.squadH;$('smc').textContent=U.close;$('kyes').textContent=U.yes;$('kno').textContent=U.no;
  $('sr').textContent=U.sumBtn;$('re').textContent=U.restart;$('recb').textContent=U.recBtn;
  updMode();drawCont();
  if(s){
    render();
    if(sq!==null)renderSq();
    if(isd)draw();
    if(kinQ!==null)$('mq').textContent=U.confirmKin(kinQ);
    if(spq)$('mq').textContent=U.spQ(s.roster[0]);
  }
  if($('sm').style.display==='flex'){if(smv==='recs')records();else if(smv&&smv[0]==='rec'){const r=loadRecs()[smv[1]];if(r)summary(r,smv[1])}else if(s)summary()}
}
// ===== 저장 (이 기기의 브라우저 localStorage) =====
const SK='hm30-save',RK='hm30-recs';
const fmtAt=at=>{try{return new Date(at).toLocaleString(U.locale,{year:'2-digit',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
function save(){
  if(!s||!first)return;
  if(over)return clearSave();
  try{localStorage.setItem(SK,JSON.stringify({v:1,name,fi:SW.indexOf(first),s,sor,sq,sqp,sqs,isd,spd,prog,lg:LG,q:Q}))}catch(e){}
}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SK));return d&&d.v===1&&d.s?d:null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SK)}catch(e){}}
function drawCont(){
  const d=loadSave();
  $('ctn').innerHTML=d?'<button onclick="cont()">'+U.cont+'<small>'+U.contInfo(esc(d.name),SW[d.fi].n,d.s.day,d.s.mon+1)+(d.s.hard?' · '+U.hardMark:'')+'</small></button><p class="q">'+U.contWarn+'</p>':'';
}
function cont(){
  const d=loadSave();if(!d)return drawCont();
  name=d.name;first=SW[d.fi];s=d.s;sor=d.sor;sq=d.sq;sqp=d.sqp||[];sqs=!!d.sqs;isd=d.isd;iss=null;over=false;kinQ=null;prog=d.prog||0;last=Date.now();
  $('intro').style.display='none';$('game').style.display='flex';$('sm').style.display='none';$('md').style.display='none';
  $('log').innerHTML='';LG=[];Q.length=0;clearTimeout(qt);qt=null;after=null;
  (d.lg||[]).forEach(x=>put(x[0],x[1],x[2]));
  document.querySelectorAll('#acts .a').forEach(b=>b.style.display='');
  $('re').style.display=$('sr').style.display='none';
  setSpd(d.spd||1);
  if(isd){draw();$('iq').style.display='flex'}else $('iq').style.display='none';
  if(sq!==null){renderSq();$('sq').style.display='flex'}else $('sq').style.display='none';
  (d.q||[]).forEach(x=>Q.push(x));if(Q.length&&!qt)pump();
  pat=0;if(Math.random()<0.5)meta(pick1(U.mCont));
  render();
}
function loadRecs(){try{const r=JSON.parse(localStorage.getItem(RK));return Array.isArray(r)?r:[]}catch(e){return []}}
function addRec(r){
  const rs=loadRecs();rs.unshift(r);rs.length=Math.min(rs.length,30);
  for(let i=rs.length;i>=0;i--){
    try{localStorage.setItem(RK,JSON.stringify(rs));return}catch(e){}
    // 저장 공간이 모자라면 오래된 기록의 선택 내역부터 덜어 냅니다.
    if(i>0&&rs[i-1])delete rs[i-1].hist;
  }
}
function records(){
  smv='recs';const rs=loadRecs();
  $('sh').textContent=U.recBtn;
  $('sb').innerHTML=rs.length?'<p class="q">'+U.recNote(rs.length)+'</p><ul class="rec">'+rs.map((r,i)=>'<li><button onclick="showRec('+i+')">'+(r.win?'🌸 ':'🥀 ')+(r.hard?'['+U.hardMark+'] ':'')+esc(r.name)+' · '+SW[r.fi].n+'<small>'+fmtAt(r.at)+' · '+r.day+U.yr+' · '+U.sumK[1]+' '+r.sc+' · '+r.n+U.cnt+'</small></button></li>').join('')+'</ul><button class="clr" onclick="clearRecs(this)">'+U.recClr+'</button>':'<p class="q">'+U.recNone+'</p>';
  $('sm').style.display='flex';$('sm').firstChild.scrollTop=0;
}
function showRec(i){const r=loadRecs()[i];if(r)summary(r,i)}
function clearRecs(b){
  if(!b.dataset.arm){b.dataset.arm=1;b.textContent=U.recClrQ;return}
  try{localStorage.removeItem(RK)}catch(e){}records();
}
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
$('acts').innerHTML=[0,1,2,5,10].map(v=>'<button class="a" data-v="'+v+'" onclick="setSpd('+v+')">'+(v?v+'×':'⏸')+'</button>').join('')+'<button id="sr" onclick="summary()"></button><button id="re" onclick="intro()"></button>';
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape')$('sm').style.display='none';
  if(e.key==='Escape'&&kinQ!==null)return kinNo();
  if($('game').style.display!=='flex'||kinQ!==null||iss!==null||sq!==null)return;
  if(e.key===' '){e.preventDefault();setSpd(0)}
  if(e.key>='1'&&e.key<='4')setSpd([1,2,5,10][+e.key-1]);
  if((e.key==='r'||e.key==='R')&&over)intro();
});
applyUI();intro();setInterval(loop,100);
</script>
</body>
</html>
